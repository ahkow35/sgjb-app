name: CI

on:
  # Pull requests only, and not while a PR is a draft: checks run once the PR is marked
  # ready (or on a push to a ready PR), so the minutes go on the code about to merge.
  # No run on push to main: it would repeat the run the merged PR just passed.
  # workflow_dispatch allows a manual run from the Actions tab.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, lockfile-enforced)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx jest --ci
